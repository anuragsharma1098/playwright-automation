name: Playwright Tests

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A push to a branch with an open PR fires both `push` and `pull_request` for the same commit;
# cancel the superseded run rather than hitting the two live production sites twice at once.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automation Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # lint-staged (devDependency, used by Husky's pre-commit hook) requires Node >=22.22.1 -
      # matches package.json's "engines" field.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # allure-commandline (installed below via npm ci) needs a JRE at runtime to generate the
      # report - explicit rather than relying on whatever happens to be preinstalled on the runner.
      - name: Setup Java (for Allure report generation)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Clean previous Allure results
        run: npm run allure:clean

      # Runs only the @smoke tier (tests/smoke/) - the fast "is every site up and can a guest
      # book?" checks. The @regression tier (tests/regression/ plus TC1-TC6) is for local/manual
      # runs via `npm run test:regression`. demo-intentional-failure.spec.ts is untagged and is
      # also excluded by `testIgnore` in playwright.config.ts.
      #
      # Restricted to chromium/webkit projects: the playwright/playwright Docker image
      # only bundles those three engines. The *-edge projects (real Microsoft Edge via the
      # 'msedge' channel) aren't in this image and are meant for local/manual runs instead.
      - name: Run smoke tests (all sites, chromium/webkit)
        run: npm run test -- --grep @smoke --project='*-chromium' --project='*-webkit'
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit-report.xml
          retention-days: 14

      - name: Upload raw test results (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
