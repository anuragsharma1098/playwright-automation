services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: vacation-rental-automation-dev:latest
    container_name: vacation-rental-automation-dev

    # Workspace bind mount + a named volume for node_modules so host/container installs don't
    # collide (Windows/Linux native module builds differ).
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules

    working_dir: /workspace
    ipc: host

    stdin_open: true
    tty: true

    environment:
      NODE_ENV: development

    # Published so a manual `docker compose up` (no VS Code auto-forwarding) can still reach
    # these from the host: 9000 is `npm run allure:open`/`allure:serve`, 9224 is
    # `npm run test:ui:docker` (Playwright UI mode), 9323 is `npm run report` (Playwright HTML
    # report) - all viewed in a host browser since the container itself has no display.
    ports:
      - '9000:9000'
      - '9224:9224'
      - '9323:9323'

    command: /bin/bash

volumes:
  node_modules:
    driver: local
